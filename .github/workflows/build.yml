name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # The Windows job is the point of this matrix: `watcher/windows.rs` is written on a
    # Mac and cannot be compiled there, so this is where it is first proven to build.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npx vitest run

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: npm run tauri build -- --no-bundle

  # Installers, on demand: a .dmg for macOS and an .msi + .exe for Windows. Run it from
  # the Actions tab (or push a v* tag) and download the artifacts from the run summary —
  # the Windows installer is built on Windows, since there is no cross-compiler for it.
  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Bundle
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: nudgy-${{ matrix.name }}
          # Neither installer is code-signed, so macOS shows Gatekeeper's "damaged or
          # unidentified developer" prompt and Windows shows SmartScreen. Both are
          # get-throughable; signing needs a paid certificate.
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
