[package]
name = "nudgy"
version = "0.2.0"
description = "Productivity and activity daemon"
authors = ["Joshua Yamamoto-Kim"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nudgy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
regex = "1.13.1"
log = "0.4.34"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-log = "2.9.1"
interprocess = { version = "2.4.4", features = ["tokio"] }
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "charset", "http2"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
ical = { version = "0.11.0", default-features = false, features = ["ical"] }
rrule = "0.14.0"
chrono-tz = "0.10.4"
tauri-plugin-autostart = "2.5.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication", "NSApplication"] }
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }
